<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pujodex - Pujo Map</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Top bar -->
    <header class="topbar">

        <div class="brand">
            <h1>Pujodex</h1>
            <span id="pandal-count">Loading...</span>
        </div>

        <button id="list-toggle" aria-label="Toggle list view" aria-pressed="false">
            <svg viewBox="0 0 16 16" fill="none">
                <circle cx="2" cy="4" r="1.3" fill="currentColor"/>
                <circle cx="2" cy="8" r="1.3" fill="currentColor"/>
                <circle cx="2" cy="12" r="1.3" fill="currentColor"/>
                <line x1="5.5" y1="4" x2="14" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="5.5" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="5.5" y1="12" x2="14" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </button>

        <div class="search-wrapper">

            <input
                type="search"
                id="search"
                placeholder="Search pandals..."
                autocomplete="off"
            >

            <button id="clear-search" aria-label="Clear search">
                ×
            </button>

        </div>

        <button id="plan-button">
            My Plan
            <span id="plan-count">0</span>
        </button>

    </header>


    <!-- Search results -->
    <div id="search-results"></div>


    <!-- Map -->
    <main>
        <div id="map"></div>

        <!-- Floating map controls — visible in map mode only -->
        <div class="map-controls">

            <button id="locate-button" aria-label="Show my location" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="1.6"/>
                    <circle cx="12" cy="12" r="3" fill="currentColor"/>
                    <path d="M12 1v3.2M12 19.8V23M1 12h3.2M19.8 12H23" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </button>

        </div>

        <div id="list-panel">
            <div id="zone-strip"></div>
            <div id="list-rows"></div>
        </div>

        <!-- Explore — placeholder for now -->
        <section id="explore-view">
            <div class="explore-placeholder">
                <h2>Explore</h2>
                <p>Still under construction, will be available soon.</p>
            </div>
        </section>
    </main>


    <!-- Persistent navigation dock — always visible, in every view -->
    <nav id="nav-dock">

        <button class="dock-button" data-view="explore" aria-label="Explore">
            <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
                <path d="M15.5 8.5L13 13L8.5 15.5L11 11L15.5 8.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <span>Explore</span>
        </button>

        <button class="dock-button" data-view="map" aria-label="Map">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M9 4L3 6.5V20L9 17.5L15 20L21 17.5V4L15 6.5L9 4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <path d="M9 4V17.5M15 6.5V20" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span>Map</span>
        </button>

        <button class="dock-button" data-view="list" aria-label="Directory">
            <svg viewBox="0 0 24 24" fill="none">
                <line x1="4" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                <line x1="4" y1="17" x2="20" y2="17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
            <span>Directory</span>
        </button>

    </nav>


    <!-- Plan panel -->
    <aside id="plan-panel">

        <div class="plan-header">

            <div>
                <h2>My Pujo Plan</h2>
                <span id="plan-summary">0 pandals</span>
            </div>

            <button id="close-plan">
                ×
            </button>

        </div>


        <div id="plan-list"></div>
        
        <div id="route-summary"></div>


        <div class="plan-actions">

    <button id="show-route">
        Show Route
    </button>

    <button id="clear-plan">
        Clear Plan
    </button>

</div>

    </aside>


    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <script src="app.js"></script>

</body>
</html>
