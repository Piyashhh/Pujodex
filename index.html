    <!-- Top bar -->
    <header class="topbar">

        <!-- The page's one <h1>. Always in the page (even where the logo
             is hidden — phones, Directory) so search engines and screen
             readers always get it. -->
        <h1 class="sr-only">Pujodex – Kolkata Durga Puja pandal map and directory</h1>

        <div class="brand">
            <svg class="brand-logo" viewBox="0 0 672.75 142.98" aria-hidden="true" focusable="false"><use href="#pujodex-logo"></use></svg>
            <span id="pandal-count">Loading...</span>
        </div>

        <div class="search-wrapper">

            <input

                id="search"
                placeholder="Search pandals..."
                aria-label="Search pandals"
                autocomplete="off"

            </button>

        </div>

        <button id="plan-button" aria-label="Open My Plan">
            <span class="plan-label">My Plan</span>
            <span id="plan-count">0</span>
        </button>

    </header>


    <!-- Shown only when JavaScript is off -->
    <noscript>
        <div class="noscript-notice">
            <h2>Pujodex needs JavaScript</h2>
            <p>
                Pujodex is an interactive map and directory of Durga Puja
                pandals in Kolkata and nearby areas (Howrah, Hooghly and the
                24 Parganas). Turn on JavaScript to search pandals, browse
                them by zone and plan your pandal-hopping route.
            </p>
        </div>
    </noscript>


    <!-- Search results -->
    <div id="search-results"></div>


    <!-- Map -->
    <main>
        <div id="map"></div>

        <!-- Floating map controls — visible in map mode only -->
        <div class="map-controls">

            <button id="locate-button" aria-label="Show my location" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="1.6"/>
                    <circle cx="12" cy="12" r="3" fill="currentColor"/>
                    <path d="M12 1v3.2M12 19.8V23M1 12h3.2M19.8 12H23" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </button>

        </div>

        <div id="list-panel">
            <div id="zone-strip"></div>
            <div id="list-rows"></div>
        </div>

        <!-- Explore — placeholder for now -->
        <section id="explore-view">
            <div class="explore-placeholder">
                <svg class="explore-logo" viewBox="0 0 672.75 142.98" aria-hidden="true" focusable="false"><use href="#pujodex-logo"></use></svg>
                <h2>Explore</h2>
                <p>Still under construction, will be available soon.</p>
            </div>
        </section>
    </main>

        <button class="dock-button" data-view="explore" aria-label="Explore">
            <svg viewBox="0 0 24 24" fill="none">

                <path d="M15.5 8.5L13 13L8.5 15.5L11 11L15.5 8.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <span>Explore</span>
        </button>

            <svg viewBox="0 0 24 24" fill="none">
                <path d="M9 4L3 6.5V20L9 17.5L15 20L21 17.5V4L15 6.5L9 4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <path d="M9 4V17.5M15 6.5V20" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span>Map</span>
        </button>

        <button class="dock-button" data-view="list" aria-label="Directory">
            <svg viewBox="0 0 24 24" fill="none">
                <line x1="4" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>

                <line x1="4" y1="17" x2="20" y2="17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
            <span>Directory</span>
        </button>

    </nav>
